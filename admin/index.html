<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>অ্যাডমিন প্যানেল — Admin Panel | Mirpur College Rover Scout Group</title>
<link rel="icon" type="image/png" href="img/logo.png" />

<!-- Tailwind utility classes (layout/spacing/grid/flex helpers only —
     colors, typography and components come from css/admin.css) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide icon set, used the same way the original React app used lucide-react -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- SheetJS — used by admin/js/pages2.js (exportToExcel) to build the .xlsx file for Export/Backup -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Firebase (compat build — works with plain <script> tags, no bundler
     needed). See js/firebase-config.js and FIREBASE-SETUP.md. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div id="root"></div>

<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/firebase-content.js"></script>
<script src="js/pages.js"></script>
<script src="js/pages2.js"></script>
</body>
</html>
